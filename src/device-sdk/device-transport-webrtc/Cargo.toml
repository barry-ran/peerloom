[package]
name = "device-transport-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# webrtc 尚未重新导出 mDNS 与 SCTP 限额类型；保持同版本，仅配置协议基建。
rtc = { version = "=0.21.1", default-features = false }
async-trait = "=0.1.89"
bytes = "=1.12.0"
device-protocol = { path = "../device-protocol" }
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
webrtc = { version = "=0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
