[package]
name = "device-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-diagnostics = ["device-transport-webrtc/test-diagnostics"]

[dependencies]
device-protocol = { path = "../device-protocol" }

device-storage = { path = "../device-storage" }
device-transport-webrtc = { path = "../device-transport-webrtc" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
uuid = { version = "=1.29.0", features = ["v4"] }
time = { version = "=0.3.55", features = ["parsing", "formatting"] }
zeroize = "=1.9.1"
getrandom = "=0.4.3"
base64 = "=0.22.1"

tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "=0.3.34", features = ["sink"] }

rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-platform-verifier = "=0.7.1"

[dev-dependencies]
async-trait = "=0.1.89"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
