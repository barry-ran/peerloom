[workspace]
resolver = "3"
members = ["device-protocol", "device-core", "device-transport-webrtc", "device-storage", "device-storage-windows", "device-ffi"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# 最小官方Apple cfg回移，来源与完整逐文件校验见third_party/rust。
[patch.crates-io]
webrtc = { path = "../../third_party/rust/webrtc-0.21.1/crate" }
nix = { path = "../../third_party/rust/nix-0.31.3/crate" }
rtc = { path = "../../third_party/rust/rtc-0.21.1/crate" }
