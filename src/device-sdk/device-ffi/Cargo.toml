[package]
name = "device-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"

[features]
test-diagnostics = ["device-core/test-diagnostics"]

[dependencies]
device-protocol = { path = "../device-protocol" }
device-core = { path = "../device-core" }
device-transport-webrtc = { path = "../device-transport-webrtc" }
device-storage = { path = "../device-storage" }
async-trait = "=0.1.89"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.52.3", features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
