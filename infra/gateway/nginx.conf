pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 256;
}
http {
    access_log off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;
    client_max_body_size 1m;
    server {
        listen 8080;
        location = /metrics {
            return 404;
        }
        location = /v1/device-signal {
            proxy_pass http://device-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 70s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }
        location = /admin {
            return 308 /admin/;
        }
        location /admin/ {
            proxy_pass http://device-server:8080;
            # Keep the original authority, including the explicit loopback port.
            # The application compares Host/Origin to configured ADMIN_ORIGIN.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Do not trust an inbound X-Forwarded-For chain.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location / {
            proxy_pass http://device-server:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
