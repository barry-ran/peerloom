name: Temporary Android close retirement candidate
on:
  push:
    branches: ['codex/verify-native-close-20261102']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 隔离构建安全负例（不启动真实模拟器或修改KVM）
        run: |
          python3 bindings/android/scripts/test-build-safety.py
          python3 bindings/android/scripts/test-diagnostics.py
          python3 bindings/android/scripts/test-trust-fixture.py
          python3 bindings/android/scripts/test-service-control.py
      - name: 固定工具链
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.99.1 --profile minimal
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1' < /dev/null
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          rustc +1.99.1 --version
          cat "$ANDROID_HOME/ndk/29.0.14206865/source.properties"
      - name: Focused native retirement regression
        run: cargo +1.99.1 test --locked --manifest-path src/device-sdk/Cargo.toml -p device-ffi --lib
      - name: 两个ABI真实构建、AAR和示例APK
        working-directory: bindings/android
        run: |
          ./gradlew --no-daemon :library:testDebugUnitTest :library:assembleRelease :library:assembleDebugAndroidTest :sample:assembleDebug
          mkdir -p ../../dist/android
          cp library/build/outputs/aar/library-release.aar ../../dist/android/
          cp library/build/outputs/apk/androidTest/debug/library-debug-androidTest.apk ../../dist/android/
          cp sample/build/outputs/apk/debug/sample-debug.apk ../../dist/android/
          cp ../../src/device-sdk/device-ffi/include/device_sdk.h ../../dist/android/
          cp ../../LICENSE ../../dist/android/
          ./gradlew --no-daemon :library:dependencies --configuration releaseRuntimeClasspath > ../../dist/android/maven-runtime.txt
          ./gradlew --no-daemon :library:dependencies --configuration debugAndroidTestRuntimeClasspath > ../../dist/android/maven-test.txt
          ./gradlew --no-daemon :library:testMavenPomBinding :library:prepareMavenPomEvidence
          cargo +1.99.1 metadata --manifest-path ../../src/device-sdk/Cargo.toml --format-version 1 --locked > ../../dist/android/cargo-metadata.json
      - name: 离线采集 Maven 原文证据（不代表法律清关）
        working-directory: bindings/android
        run: |
          python3 scripts/test-maven-evidence.py
          ./gradlew --no-daemon --offline :library:collectMavenEvidence
          status=0
          python3 scripts/collect-maven-evidence.py --input build/maven-evidence-input.json --output "$(realpath -m ../../dist/android/maven-evidence)" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          test -s ../../dist/android/maven-evidence/report.json
          test -s ../../dist/android/maven-evidence/sbom.cdx.json
          test -s ../../dist/android/maven-evidence/SHA256SUMS
          python3 - "$status" <<'PYVERIFY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path('../../dist/android/maven-evidence/report.json').read_text())
          expected = 'incomplete' if sys.argv[1] == '2' else 'collected-not-legally-reviewed'
          if report.get('evidence_status') != expected:
              raise SystemExit('Maven evidence status mismatch')
          PYVERIFY
          (cd ../../dist/android/maven-evidence && sha256sum --check --strict SHA256SUMS)
          if [ "$status" -eq 2 ]; then echo '::warning::Maven evidence incomplete; not eligible as complete Release evidence'; fi
      - name: 验证ELF与APK真实16KB对齐
        run: |
          python3 bindings/android/scripts/verify-artifacts.py dist/android/library-release.aar dist/android/sample-debug.apk dist/android/library-debug-androidTest.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/android/sample-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/android/library-debug-androidTest.apk
          (cd dist/android && find . -type f ! -path './SHA256SUMS' -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache-dependency-path: src/device-server/go.sum
      - name: Android release AAR 与 Cargo/Maven 原文证据映射
        run: |
          python3 scripts/test-package-release.py
          python3 scripts/package-third-party.py
          python3 scripts/package-release.py --platform android --output dist/android/release-package
          (cd dist/android && find . -type f ! -path './SHA256SUMS' -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Candidate provenance and JNI ABI evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,tempfile,zipfile
          from pathlib import Path
          root=Path('dist/android');aar=root/'library-release.aar'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          nm=Path(os.environ['ANDROID_HOME'])/'ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm'
          native={}
          with zipfile.ZipFile(aar) as z, tempfile.TemporaryDirectory() as tmp:
              names=sorted(n for n in z.namelist() if n.startswith('jni/') and n.endswith('.so'))
              assert {n.split('/')[1] for n in names}=={'arm64-v8a','x86_64'}
              for n in names:
                  p=Path(tmp)/n.replace('/','_');p.write_bytes(z.read(n))
                  symbols=subprocess.check_output([str(nm),'-D','--defined-only',str(p)],text=True)
                  assert 'JNI_OnLoad' in symbols and 'Java_io_peerloom_sdk_Native_submit' in symbols
                  assert b'local_close_status' in p.read_bytes()
                  (root/(n.split('/')[1]+'-jni-symbols.txt')).write_text(symbols)
                  native[n]=sha(p)
          data={'kind':'unpublished-native-close-candidate','head_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'baseline':'ac6db1cefbe917df0d9076dd2d4afe706d700203','sdk_patch_sha256':'b7396d936a20bc6a1304c2dc80b4e6f78df125b2aad5e04b526291fd2f3435c4','aar_sha256':sha(aar),'jni_sha256':native,'source_sha256':{str(p):sha(p) for p in map(Path,['src/device-sdk/device-ffi/src/bridge.rs','src/device-sdk/device-ffi/src/channels.rs','src/device-sdk/device-ffi/src/state.rs'])}}
          (root/'candidate-provenance.json').write_text(json.dumps(data,indent=2))
          PY
          (cd dist/android && find . -type f ! -path './SHA256SUMS' -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peerloom-android-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 14
      - name: 保存 Android release-only SDK 包（证据状态见元数据）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peerloom-android-release-${{ github.sha }}
          path: dist/android/release-package/
          if-no-files-found: error
          retention-days: 14
