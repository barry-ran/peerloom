name: 基础检查与开发环境集成
on:
  push:
    # Functional changes are validated before the normal fast-forward to master.
    branches-ignore: [master]
    paths-ignore:
      - 'README.md'
      - 'docs/*.md'
      - 'docs/assets/peerloom-banner.svg'
      - 'deploy/server/README.md'
      - 'bindings/android/README.md'
      - 'bindings/android/scripts/Maven证据说明.md'
      - 'bindings/ios/Apple封装说明.md'
      - 'release/approved-plan.json'
      - 'scripts/release-admin.py'
      - 'scripts/release-policy.py'
      - 'scripts/test-release-admin.py'
      - 'scripts/test-workflow-triggers.py'
      - '.github/workflows/release-admin.yml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/*.md'
      - 'docs/assets/peerloom-banner.svg'
      - 'deploy/server/README.md'
      - 'bindings/android/README.md'
      - 'bindings/android/scripts/Maven证据说明.md'
      - 'bindings/ios/Apple封装说明.md'
      - 'release/approved-plan.json'
      - 'scripts/release-admin.py'
      - 'scripts/release-policy.py'
      - 'scripts/test-release-admin.py'
      - 'scripts/test-workflow-triggers.py'
      - '.github/workflows/release-admin.yml'
  # Explicit full validation remains available, including on master.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: src/device-server/go.mod
          cache-dependency-path: src/device-server/go.sum
      - name: 安装固定 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: 安装固定契约测试依赖
        run: |
          python3 -m venv "$RUNNER_TEMP/peerloom-python"
          "$RUNNER_TEMP/peerloom-python/bin/pip" install -r scripts/requirements-contracts.txt
          echo "$RUNNER_TEMP/peerloom-python/bin" >> "$GITHUB_PATH"
      - name: 安装隔离 Secret Service 测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring
      - name: 校验固定 rtc 入站元数据补丁来源
        run: python3 scripts/test-vendored-rtc.py
      - name: 单元测试与静态检查
        id: static-checks
        run: ./scripts/check.sh
      - name: Linux Secret Service 真实持久化与失效关闭
        timeout-minutes: 5
        run: ./scripts/test-secret-service.sh
      - name: 生成隔离开发秘密并验证 Compose
        id: compose-setup
        run: |
          python3 scripts/generate-dev-secrets.py
          ./scripts/check-compose.sh --integration
      - name: PostgreSQL 迁移、C 身份重置与托管中继故障恢复
        if: ${{ !cancelled() && steps.static-checks.outcome == 'success' && steps.compose-setup.outcome == 'success' }}
        run: ./scripts/test-compose.sh
      - name: 当前全部迁移的隔离 PostgreSQL 逻辑备份恢复
        if: ${{ !cancelled() && steps.static-checks.outcome == 'success' && steps.compose-setup.outcome == 'success' }}
        timeout-minutes: 10
        run: ./scripts/test-backup-container.sh
      - name: 临时证书的 HTTPS/WSS 与管理后台 Secure Cookie
        if: ${{ !cancelled() && steps.static-checks.outcome == 'success' && steps.compose-setup.outcome == 'success' }}
        timeout-minutes: 10
        run: python3 scripts/test-tls-compose.py --integration
      - name: 原生 WebRTC 双端直连与消息互通
        if: ${{ !cancelled() && steps.static-checks.outcome == 'success' && steps.compose-setup.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: src/device-sdk
        run: cargo test -p device-transport-webrtc --test native_pair --locked -- --ignored --nocapture
      - name: Auto 不可达 TURN 的有界直连与 RelayOnly 失效关闭
        timeout-minutes: 5
        working-directory: src/device-sdk
        run: cargo test -p device-transport-webrtc --test auto_unreachable_turn --locked -- --ignored --nocapture
      - name: 原生 WebRTC 字节流与半关闭
        if: ${{ !cancelled() && steps.static-checks.outcome == 'success' && steps.compose-setup.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: src/device-sdk
        run: cargo test -p device-transport-webrtc --test stream_pair --locked -- --ignored --nocapture
      - name: 原生 WebRTC 混合通道与六种 DCEP 元数据
        if: ${{ !cancelled() && steps.static-checks.outcome == 'success' && steps.compose-setup.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: src/device-sdk
        run: |
          cargo test -p device-transport-webrtc --test mixed_channels --locked -- --ignored --nocapture
          cargo test -p device-transport-webrtc --lib actual_dcep_metadata_preserves_all_six_wire_types --locked -- --ignored --nocapture
      - name: 真实 TURN 中继与错误凭证拒绝
        if: ${{ !cancelled() && steps.static-checks.outcome == 'success' && steps.compose-setup.outcome == 'success' }}
        timeout-minutes: 2
        run: ./scripts/test-turn.sh
      - name: 构建可下载检查产物
        run: ./scripts/build.sh
      - name: 服务端部署初始化与归档失效关闭测试
        env:
          PEERLOOM_NONOWNER_TEST: '1'
        run: |
          python3 scripts/test-server-deploy.py
          python3 scripts/test-server-package-script.py
      - name: 仅解服务端交付包的真实 TLS 管理与 WSS 验收
        timeout-minutes: 8
        run: python3 scripts/test-server-package.py --package dist/release/server-linux-amd64/peerloom-server-linux-amd64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peerloom-foundation-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: 保存独立 Linux SDK release ABI 包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peerloom-linux-release-${{ github.sha }}
          path: dist/release/linux-x86_64/
          if-no-files-found: error
          retention-days: 14
      - name: 保存独立 Linux amd64 服务端部署包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peerloom-server-linux-amd64-release-${{ github.sha }}
          path: dist/release/server-linux-amd64/
          if-no-files-found: error
          retention-days: 14
      - name: 删除本次作业秘密
        if: always()
        run: rm -rf .secrets

  capacity-500:
    name: capacity-500
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: src/device-server/go.mod
          cache-dependency-path: src/device-server/go.sum
      - name: 安装固定 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: 容量运行器安全回归
        run: |
          python3 scripts/test-capacity-ci.py
          python3 scripts/test-exclusive-controller.py
      - name: 准备隔离固定依赖缓存
        id: capacity-cache
        run: |
          mkdir -m 700 "$RUNNER_TEMP/peerloom-capacity-deps"
          printf 'key=capacity-linux-v1-%s-%s-%s\n' "$RUNNER_ARCH" "${ImageVersion:?}" '${{ hashFiles('bindings/ios/scripts/apple-service-dependencies.json', 'bindings/ios/scripts/apple-service.py') }}' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/peerloom-capacity-deps
          key: ${{ steps.capacity-cache.outputs.key }}
      - name: 真实 500 SDK 容量与独占会话接管
        run: |
          python3 scripts/run-capacity-ci.py \
            --cache "$RUNNER_TEMP/peerloom-capacity-deps" \
            --output "$RUNNER_TEMP/peerloom-capacity-evidence"
      - name: 保存容量脱敏证据（不上传私有运行目录）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peerloom-capacity-500-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/peerloom-capacity-evidence/source-manifest.json
            ${{ runner.temp }}/peerloom-capacity-evidence/dependency-provenance.json
            ${{ runner.temp }}/peerloom-capacity-evidence/capacity-result.json
            ${{ runner.temp }}/peerloom-capacity-evidence/resource-samples.json
            ${{ runner.temp }}/peerloom-capacity-evidence/exclusive-result.json
