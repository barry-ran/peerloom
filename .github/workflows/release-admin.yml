name: 受审计划正式发布
on:
  push:
    branches: [master]
    paths: ['release/approved-plan.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: peerloom-release-administration
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'barry-ran/peerloom' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 scripts/test-release-admin.py
      - id: plan
        name: 只读核对精确提交、全部门禁和产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-admin.py
  apply-approved-plan:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true' && github.repository == 'barry-ran/peerloom' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 再验证并仅执行受审计划
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-admin.py --execute
